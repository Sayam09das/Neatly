# Local / integration containers only.
# Production PostgreSQL, Supabase Storage, and Brevo SMTP stay external.
# Do not commit secrets. Supply values from the host environment or gitignored
# env files. See docs/DEPLOYMENT.md.
#
# CI publishes images to GitHub Container Registry on push to main:
#   ghcr.io/<owner>/<repo>/web:<sha|latest>
#   ghcr.io/<owner>/<repo>/api:<sha|latest>
# Pull those instead of building:
#   NEATLY_WEB_IMAGE=ghcr.io/<owner>/<repo>/web:latest \
#   NEATLY_API_IMAGE=ghcr.io/<owner>/<repo>/api:latest \
#   docker compose pull && docker compose up

services:
  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: ${NEATLY_API_IMAGE:-neatly-api:local}
    ports:
      - "${API_HOST_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
      HOST: "0.0.0.0"
      DATABASE_URL: ${DATABASE_URL:-}
      DIRECT_URL: ${DIRECT_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Neatly}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_SERVICES_THUMB_BUCKET: ${SUPABASE_SERVICES_THUMB_BUCKET:-Services_Thumb}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    image: ${NEATLY_WEB_IMAGE:-neatly-web:local}
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEATLY_API_URL: ${NEATLY_API_URL:-http://api:4000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    depends_on:
      api:
        condition: service_healthy
