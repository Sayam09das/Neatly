name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_call:

permissions:
  contents: read
  actions: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group' }}

env:
  CI: true
  HUSKY: "0"
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
  DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node

      - name: Biome format
        run: pnpm format:check

      - name: Biome lint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node

      - name: Prisma schema
        run: pnpm db:validate

      - name: TypeScript
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node

      - name: Vitest
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node

      - name: Next.js production build
        run: pnpm --filter @neatly/web build

      - name: API production build
        run: pnpm build:api

  docker:
    name: Docker
    needs: [lint, typecheck, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUSH_IMAGE: ${{ github.event_name == 'push' || github.event_name == 'workflow_call' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: web
            file: apps/web/Dockerfile
            build_args: NEXT_PUBLIC_SITE_URL=http://localhost:3000
          - name: api
            file: apps/server/Dockerfile
            build_args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: GHCR image name
        id: image
        run: |
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${repo}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable=${{ env.PUSH_IMAGE == 'true' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=neatly-${{ matrix.name }}
            org.opencontainers.image.description=Neatly ${{ matrix.name }} process

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: ${{ env.PUSH_IMAGE == 'true' }}
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: ${{ !github.event.pull_request.head.repo.fork && format('type=gha,mode=max,scope={0}', matrix.name) || '' }}

      - name: Record image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### neatly-${{ matrix.name }}"
            echo
            if [ "$PUSH_IMAGE" = "true" ]; then
              echo "Published to GitHub Container Registry:"
            else
              echo "Built on the runner only (pull requests are not pushed):"
            fi
            echo
            echo "\`\`\`"
            echo "$IMAGE_TAGS"
            echo "\`\`\`"
            echo
            echo "Package: \`$IMAGE_NAME\`"
          } >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: CI
    if: always()
    needs: [lint, typecheck, test, build, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm required jobs
        env:
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          DOCKER: ${{ needs.docker.result }}
        run: |
          for result in "$LINT" "$TYPECHECK" "$TEST" "$BUILD" "$DOCKER"; do
            if [ "$result" != "success" ]; then
              echo "A required CI job did not succeed."
              echo "lint=$LINT typecheck=$TYPECHECK test=$TEST build=$BUILD docker=$DOCKER"
              exit 1
            fi
          done
          echo "All required CI jobs succeeded."
