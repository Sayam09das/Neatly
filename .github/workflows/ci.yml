name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_call:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group' }}

env:
  CI: true
  HUSKY: "0"
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node

      - name: Biome format
        run: pnpm format:check

      - name: Biome lint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node

      - name: Prisma schema
        run: pnpm db:validate

      - name: TypeScript
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node

      - name: Vitest
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node

      - name: Next.js production build
        run: pnpm --filter @neatly/web build

      - name: API production build
        run: pnpm build:api

  docker:
    name: Docker
    needs: [lint, typecheck, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: web
            file: apps/web/Dockerfile
            image: neatly-web
            build_args: NEXT_PUBLIC_SITE_URL=http://localhost:3000
          - name: api
            file: apps/server/Dockerfile
            image: neatly-api
            build_args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          provenance: false
          sbom: false
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:latest
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: ${{ !github.event.pull_request.head.repo.fork && format('type=gha,mode=max,scope={0}', matrix.name) || '' }}

  ci:
    name: CI
    if: always()
    needs: [lint, typecheck, test, build, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm required jobs
        env:
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          DOCKER: ${{ needs.docker.result }}
        run: |
          for result in "$LINT" "$TYPECHECK" "$TEST" "$BUILD" "$DOCKER"; do
            if [ "$result" != "success" ]; then
              echo "A required CI job did not succeed."
              echo "lint=$LINT typecheck=$TYPECHECK test=$TEST build=$BUILD docker=$DOCKER"
              exit 1
            fi
          done
          echo "All required CI jobs succeeded."
