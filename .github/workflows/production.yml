name: Production

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  CI: true
  HUSKY: "0"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  gate:
    name: Production gate
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Record verified SHA
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          {
            echo "## Production verification"
            echo
            echo "- Commit: \`${RELEASE_SHA}\`"
            echo "- Images verified: \`neatly-web:${RELEASE_SHA}\` / \`neatly-api:${RELEASE_SHA}\`"
            echo "- Registry push: not configured"
            echo "- Host rollout: not configured"
            echo
            echo "Apply schema changes only as a controlled API release:"
            echo
            echo "\`\`\`bash"
            echo "pnpm db:migrate:deploy"
            echo "\`\`\`"
            echo
            echo "Do not run \`prisma migrate reset\` or \`pnpm db:seed\` in production."
            echo "Keep web and API on the same git SHA."
          } >> "$GITHUB_STEP_SUMMARY"
