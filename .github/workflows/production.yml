name: Production

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Quality gates
        run: pnpm typecheck && pnpm lint && pnpm test

      - name: Production builds
        run: pnpm build && pnpm build:api
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: |
            neatly-web:${{ github.sha }}
            neatly-web:latest
          build-args: |
            NEXT_PUBLIC_SITE_URL=http://localhost:3000

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          tags: |
            neatly-api:${{ github.sha }}
            neatly-api:latest

      - name: Deployment
        run: |
          echo "Images built as neatly-web:${GITHUB_SHA} and neatly-api:${GITHUB_SHA}."
          echo "Registry push, migrate deploy, and host rollout are not configured."
          echo "Run pnpm db:migrate:deploy only as a controlled API release step."
          echo "Do not run prisma migrate reset or pnpm db:seed in production."
